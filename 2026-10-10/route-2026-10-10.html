<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sale Route</title>
<link rel="stylesheet" href="../assets/sale-route.css">
</head>
<body>
<main>
  <h1 id="heading"></h1>
  <p class="sub"><span id="summary"></span> <span id="progress"></span></p>

  <div class="controls">
    <div class="field">
      <label for="start">Start / end location</label>
      <input id="start" type="text" value="Current Location" autocomplete="off">
    </div>
    <a id="route-link" class="btn" target="_blank" rel="noopener">Open route in Google Maps</a>
  </div>

  <div class="wrap">
    <table>
      <thead>
        <tr><th>Visited?</th><th>#</th><th>Address</th><th>Type</th><th>Opens</th><th>Closes</th><th>Listing</th></tr>
      </thead>
      <tbody id="stops"></tbody>
    </table>
  </div>

  <p class="note" id="note"></p>
</main>
<script src="../assets/sale-route.js"></script>
</body>
</html>
